<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Profile | Mentor Bot</title>
    <link rel="stylesheet" href="profile.css" />
    <style>
        /* Optional inline CSS if you want quick styling */
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .profile-container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        
        .save-btn {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        
        .save-btn:hover {
            background: #0056b3;
        }
        
        #subject-list span {
            display: inline-block;
            background: #e0e0e0;
            padding: 4px 8px;
            margin: 4px 4px 0 0;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="profile-container">
        <h1>🎓 Student Profile</h1>

        <form id="profileForm" novalidate>
            <label for="name">Full Name</label>
            <input id="name" name="name" type="text" placeholder="Enter your name" required />

            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Enter your email" required />

            <label for="examGoal">Your Exam/Goal</label>
            <input id="examGoal" name="examGoal" type="text" placeholder="E.g., Semester Exams, Placements" />

            <label for="futureAim">Future Aim</label>
            <input id="futureAim" name="futureAim" type="text" placeholder="E.g., Software Engineer, MBA" />

            <label>Subjects to Focus On</label>
            <div class="add-subject">
                <input id="new-subject" type="text" placeholder="Enter a subject and press Add or Enter">
                <button id="add-subject-btn" type="button">Add</button>
            </div>
            <div id="subject-list" class="subject-list"></div>

            <label for="targetDate">Target Completion Date</label>
            <input id="targetDate" name="targetDate" type="date" />

            <button type="submit" class="save-btn">Save Profile</button>
        </form>
    </div>

    <!-- Firebase compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        // Friend's Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCsdv2DcDa_u-kNBAXuq3TXp9nfdLy-chs",
            authDomain: "margadarshi-85118.firebaseapp.com",
            databaseURL: "https://margadarshi-85118-default-rtdb.firebaseio.com",
            projectId: "margadarshi-85118",
            storageBucket: "margadarshi-85118.firebasestorage.app",
            messagingSenderId: "868205365403",
            appId: "1:868205365403:web:6c412eb371a1388f68de3e"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        console.log("✅ Firebase connected (compat mode)");

        // Add subjects dynamically
        const addSubjectBtn = document.getElementById("add-subject-btn");
        const newSubjectInput = document.getElementById("new-subject");
        const subjectList = document.getElementById("subject-list");

        addSubjectBtn.addEventListener("click", () => {
            const subject = newSubjectInput.value.trim();
            if (subject) {
                const span = document.createElement("span");
                span.textContent = subject;
                subjectList.appendChild(span);
                newSubjectInput.value = "";
            }
        });

        // Form submit
        const profileForm = document.getElementById("profileForm");
        profileForm.addEventListener("submit", async(e) => {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const examGoal = document.getElementById("examGoal").value;
            const futureAim = document.getElementById("futureAim").value;
            const targetDate = document.getElementById("targetDate").value;

            const subjects = [];
            subjectList.querySelectorAll("span").forEach(span => subjects.push(span.textContent));

            try {
                await db.collection("profiles").add({
                    name,
                    email,
                    examGoal,
                    futureAim,
                    targetDate,
                    subjects,
                    createdAt: new Date()
                });
                alert("✅ Profile saved successfully!");
                profileForm.reset();
                subjectList.innerHTML = "";
            } catch (err) {
                console.error("❌ Error saving profile:", err);
                alert("❌ Error saving profile. Check console.");
            }
        });
    </script>
</body>

</html>
